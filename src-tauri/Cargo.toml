[package]
name = "deadlock-mm"
version = "0.2.5"
description = "Kae Mods"
license = "GPL-3.0-only"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deadlock_mm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "io-util", "sync"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
hex = "0.4.3"
thiserror = "2.0.21"
url = "2.5.8"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "socks", "stream", "json"] }
postgresql_embedded = { version = "0.22.0", features = ["bundled", "tokio"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
crc32fast = "1.5.5"
async-trait = "0.1.92"
md-5 = "0.11.0"
sha1 = "0.10"
discord-rich-presence = "1.1.0"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
sevenz-rust2 = "0.25.0"
unrar = "0.5.8"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
source2-model = { path = "source2-model" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The model decoder (textures, meshes) is slow without optimization; the rest of the app stays quick to build.
[profile.dev.package.source2-model]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.texture2ddecoder]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.meshopt]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3

[dev-dependencies]
base64 = "0.23.1"
minisign-verify = "0.3"
tempfile = "3.27.0"
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

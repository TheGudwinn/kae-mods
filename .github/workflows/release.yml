name: Release

# Push a tag like v0.3.0 (it must match "version" in tauri.conf.json, package.json and Cargo.toml).
# The release is built, signed and published; installed apps update to it on their next start.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # Needed to create the draft release and upload assets.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Versions match the tag
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1 | tr -d '\r')
          for v in "$conf" "$pkg" "$cargo"; do
            if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
              echo "version $v does not match tag ${GITHUB_REF_NAME} (tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo)" >&2
              exit 1
            fi
          done

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          # change together with POSTGRESQL_VERSION: a cached build keeps the previously bundled archive
          prefix-key: v1-pg18

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update packages are signed; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Release ${{ github.ref_name }}
          releaseBody: Run the setup file once and later versions install by themselves. The portable exe runs without installing and does not update itself.
          # hidden while the files are uploading; the next step publishes it
          releaseDraft: true
          prerelease: false
          # Uploads latest.json, which the in-app updater reads.
          includeUpdaterJson: true
          args: --bundles nsis

      # The same build as a single file, for people who do not want to install anything.
      - name: Add the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="Kae-Mods-${GITHUB_REF_NAME#v}-windows-x64-portable.exe"
          cp "src-tauri/target/release/Kae Mods.exe" "$file"
          gh release upload "${GITHUB_REF_NAME}" "$file" --repo "${GITHUB_REPOSITORY}" --clobber

      # Installed apps see the new version only from this moment, with every file already in place.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
